<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>3D Logo</title>
<style>
  /* Layout: one full-screen white stage, a single 3D logo centered, no other content. */
  :root {
    --bg: #ffffff;
    --logo: #141414;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--logo);
    overflow: hidden;
  }
  #stage {
    position: absolute;
    inset: 0;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage.dragging { cursor: grabbing; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #err {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font: 14px/1.4 system-ui, sans-serif;
    color: var(--logo);
  }
</style>

<div id="stage"></div>
<div id="err">Не удалось загрузить 3D-библиотеку.</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  // Telegram Mini App init: expand, lock vertical swipe (so dragging the logo doesn't close the app).
  (function () {
    var tg = window.Telegram && window.Telegram.WebApp;
    if (!tg) return;
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { tg.disableVerticalSwipes(); } catch (e) {}
    try { tg.setHeaderColor('#ffffff'); } catch (e) {}
    try { tg.setBackgroundColor('#ffffff'); } catch (e) {}
    try { tg.setBottomBarColor('#ffffff'); } catch (e) {}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/SVGLoader.js"></script>
<script>
(function () {
  var stage = document.getElementById('stage');
  if (!window.THREE || !THREE.SVGLoader) {
    document.getElementById('err').style.display = 'flex';
    return;
  }

  var SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 71 82"><path fill-rule="evenodd" clip-rule="evenodd" fill="black" d="M33.4863 0C45.3605 0 54.9863 9.62589 54.9863 21.5C54.9863 25.6762 53.7939 29.573 51.7334 32.8721C57.4373 33.0453 62.3559 35.2141 65.8213 39.374C69.3556 43.6167 71 49.472 71 56.2021C70.9997 58.4111 69.209 60.2021 67 60.2021C64.791 60.2021 63.0003 58.4111 63 56.2021C63 50.6742 61.6438 46.8578 59.6748 44.4941C57.7872 42.2283 54.9783 40.8604 50.9863 40.8604C48.3865 40.8605 46.0105 41.6785 43.9805 43.1025C40.1048 45.8214 37.4863 50.7783 37.4863 56.2021C37.4864 58.9493 38.1603 62.2608 39.4043 65.2646C40.6716 68.3246 42.3371 70.6049 43.9805 71.7578C46.0104 73.1818 48.3865 73.9999 50.9863 74C59.2845 74 63.7339 69.0659 64.1719 68.6279C65.7339 67.0662 68.2661 67.0662 69.8281 68.6279C71.3902 70.19 71.3902 72.7231 69.8281 74.2852L69.3643 74.7529C69.0915 75.0199 68.7302 75.3586 68.2822 75.7432C67.3873 76.5113 66.146 77.4606 64.5625 78.3857C61.3836 80.243 56.8264 82 50.9863 82C46.6375 81.9999 42.6733 80.6129 39.3857 78.3066C36.0255 75.9493 33.5926 72.14 32.0127 68.3252C31.6749 67.5094 31.3689 66.6719 31.0938 65.8223C28.4349 75.0034 18.6548 82 4 82C1.79086 82 4.12323e-06 80.2091 0 78C0 75.7909 1.79086 74 4 74C18.4556 74 23.8261 66.4036 23.8262 60.6387C23.8259 54.8733 18.4543 47.2764 4 47.2764C1.90252 47.2764 0.161644 45.6555 0.0107422 43.5635C-0.139955 41.4716 1.35021 39.6184 3.42578 39.3174L18.6953 37.1025C14.6885 33.3028 12.1441 27.9764 11.9941 22.0547L11.9863 21.5C11.9863 9.62603 21.6124 0.000253575 33.4863 0ZM23.0117 44.5605C26.0233 46.6563 28.3191 49.272 29.8125 52.2119C30.3463 48.9331 31.5252 45.8163 33.2422 43.0771L23.0117 44.5605ZM33.4863 8C26.0307 8.00025 19.9863 14.0443 19.9863 21.5C19.9863 28.9558 26.0315 35 33.4873 35C40.9429 34.9997 46.9863 28.9557 46.9863 21.5C46.9863 14.0442 40.9422 8 33.4863 8Z"/></svg>';

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0xffffff, 1);
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);
  var camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);

  // Lights: soft fill from above plus two directional lights so the sides read as form.
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a8a, 0.9));
  var key = new THREE.DirectionalLight(0xffffff, 1.6);
  key.position.set(3, 4, 6);
  scene.add(key);
  var fill = new THREE.DirectionalLight(0xffffff, 0.9);
  fill.position.set(-5, -2, -4);
  scene.add(fill);

  // Build the extruded logo from the SVG path.
  var data = new THREE.SVGLoader().parse(SVG);
  // Glossy black material.
  var material = new THREE.MeshStandardMaterial({
    color: 0x141414,
    roughness: 0.38,
    metalness: 0.15
  });
  var geometries = [];
  data.paths.forEach(function (path) {
    THREE.SVGLoader.createShapes(path).forEach(function (shape) {
      geometries.push(new THREE.ExtrudeGeometry(shape, {
        depth: 12,
        curveSegments: 28,
        bevelEnabled: true,
        bevelThickness: 1.6,
        bevelSize: 1.2,
        bevelOffset: 0,
        bevelSegments: 5
      }));
    });
  });

  var inner = new THREE.Group();
  geometries.forEach(function (g) { inner.add(new THREE.Mesh(g, material)); });

  // Center the logo on its own bounding box, then flip it upright (SVG y points down).
  var box = new THREE.Box3().setFromObject(inner);
  var c = box.getCenter(new THREE.Vector3());
  inner.children.forEach(function (m) { m.position.sub(c); });
  var scale = 2.5 / (box.max.y - box.min.y);
  inner.scale.setScalar(scale);
  inner.rotation.x = Math.PI;

  // The tilt group gives the permanent slight perspective; the spinner turns inside it.
  var TILT = 0;            // camera is level: no vertical tilt
  var START = -0.55;      // starting turn, so the first frame is already in perspective
  var spinner = new THREE.Group();
  spinner.add(inner);
  var tilt = new THREE.Group();
  tilt.add(spinner);
  scene.add(tilt);

  // Rotation state.
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var AUTO_SPEED = reduce ? 0.18 : 0.5;  // rad/s, slow continuous spin
  var auto = 0;                          // the always-advancing spin angle
  var offX = 0, offY = 0;                // manual offset added by dragging
  var dragging = false, lastX = 0, lastY = 0;

  stage.addEventListener('pointerdown', function (e) {
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
    stage.classList.add('dragging');
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  });
  stage.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    offY += (e.clientX - lastX) * 0.01;
    offX += (e.clientY - lastY) * 0.01;
    lastX = e.clientX; lastY = e.clientY;
  });
  function release() {
    if (!dragging) return;
    dragging = false;
    stage.classList.remove('dragging');
    // Take the shortest way back to the normal position.
    var TAU = Math.PI * 2;
    offY = ((offY + Math.PI) % TAU + TAU) % TAU - Math.PI;
    offX = ((offX + Math.PI) % TAU + TAU) % TAU - Math.PI;
  }
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);
  stage.addEventListener('lostpointercapture', release);

  function resize() {
    var w = stage.clientWidth || 1, h = stage.clientHeight || 1;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // Pull the camera back on narrow screens so the whole logo stays in view.
    var dist = 7.2 / Math.min(1, camera.aspect * 1.25);
    camera.position.set(0, 0, dist);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);
  resize();

  var prev = performance.now();
  function frame(now) {
    var dt = Math.min((now - prev) / 1000, 0.05);
    prev = now;
    auto += AUTO_SPEED * dt;
    if (!dragging) {
      var k = 1 - Math.exp(-dt * 3.2);   // ease the manual offset back to zero
      offX -= offX * k;
      offY -= offY * k;
    }
    tilt.rotation.x = TILT + offX;
    spinner.rotation.y = START + auto + offY;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body></html>
