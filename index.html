<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Obsessive Glow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Liter&display=swap">
<link rel="preload" as="image" href="photos/1.jpg">
<link rel="preload" as="image" href="photos/2.jpg">
<link rel="preload" as="image" href="photos/3.jpg">
<link rel="preload" as="image" href="photos/4.jpg">
<style>
  :root { color-scheme: light; --u: calc(min(100vw, 480px) / 1080); }
  html, body { margin: 0; background: #fff; }
  body {
    overflow-x: hidden;
    color: #000;
    font-family: 'Liter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Макет шириной 1080: --u переводит его размеры в реальные пиксели экрана (на широких экранах ограничено 480px). */
  .page {
    --e: 0;
    position: fixed;
    top: 0;
    left: 50%;
    width: min(100vw, 480px);
    margin-left: calc(min(100vw, 480px) / -2);
    height: calc(var(--u) * 2888);
    will-change: transform;
  }

  .row {
    position: absolute;
    left: 0;
    width: 100%;
    height: calc(var(--u) * 100);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .t {
    display: block;
    white-space: nowrap;
    font-weight: 400;
    font-size: calc(var(--u) * 100);
    letter-spacing: -0.05em;
    line-height: normal;
    text-box: trim-both cap alphabetic;
  }
  .t.small { font-size: calc(var(--u) * 70); letter-spacing: -0.05em; line-height: 1; }

  /* Шапка: белая подложка 200 (50 отступ, 100 название, 50 отступ), закреплена сверху */
  #head {
    --e: 0;
    position: fixed;
    top: 0;
    left: 50%;
    width: min(100vw, 480px);
    margin-left: calc(min(100vw, 480px) / -2);
    box-sizing: border-box;
    height: calc(var(--u) * 200 + env(safe-area-inset-top, 0px));
    background: #fff;
    z-index: 20;
  }
  #nameRow { top: calc(var(--u) * 50 + env(safe-area-inset-top, 0px)); }
  /* Слой над шапкой: 3D-лого и зона вращения (лого заезжает в шапку поверх подложки) */
  #fx {
    position: fixed;
    top: 0;
    left: 50%;
    width: min(100vw, 480px);
    margin-left: calc(min(100vw, 480px) / -2);
    height: 100%;
    pointer-events: none;
    z-index: 30;
  }
  /* Место под логотип слева от названия: растёт от 0 до 61×70 по мере прокрутки. */
  .slot {
    flex: none;
    width: calc(var(--u) * 61 * var(--e));
    margin-right: calc(var(--u) * 25 * var(--e));
    height: 1px;
  }

  /* «Листай ниже»: белая подложка 200 (50 отступ, 100 текст, 50 отступ), закреплена снизу, контент уезжает под неё */
  #hint {
    position: fixed;
    left: 50%;
    width: min(100vw, 480px);
    margin-left: calc(min(100vw, 480px) / -2);
    bottom: 0;
    box-sizing: border-box;
    height: calc(var(--u) * 200 + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: calc(var(--u) * 25);
    background: #fff;
    color: #000;
    pointer-events: none;
    z-index: 20;
  }
  #hint svg { flex: none; width: calc(var(--u) * 50); height: calc(var(--u) * 28); }

  /* Появление надписей: обычное мягкое всплытие */
  .label {
    opacity: 0;
    transform: translateY(calc(var(--u) * 40));
    transition: opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1);
  }
  .label.show { opacity: 1; transform: none; }
  #lblPort { top: calc(var(--u) * 300); }
  #lblPost { top: calc(var(--u) * 780); left: calc(var(--u) * 55); width: calc(var(--u) * 630); }

  /* 3D-логотип: поле 1080×1740 на отметке 300, потом уезжает в шапку */
  #stage {
    position: absolute;
    left: 0;
    top: calc(var(--u) * 300);
    width: 100%;
    height: calc(var(--u) * 1740);
    pointer-events: none;
    transform-origin: 50% 50%;
    will-change: transform;
  }
  #stage canvas { display: block; width: 100%; height: 100%; pointer-events: none; }
  /* Зона вращения меньше всего поля: всё вокруг логотипа остаётся для обычной прокрутки */
  #hit {
    position: absolute;
    left: 0; top: 0; width: 0; height: 0;
    pointer-events: auto;
    touch-action: none;
    cursor: grab;
  }
  #hit.dragging { cursor: grabbing; }
  #err {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    font: 14px/1.4 system-ui, sans-serif;
  }

  /* Фото: сначала «непрогруженный» квадрат с крестом, потом фото */
  .tile {
    position: absolute;
    box-sizing: border-box;
    border: max(calc(var(--u) * 1), 1px) solid #000;
    background: #fff;
    opacity: 0;
    transition: opacity .2s linear;
  }
  .tile.ph { opacity: 1; }
  .tile svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: opacity .5s; }
  .tile svg line { stroke: #222; stroke-width: 1; vector-effect: non-scaling-stroke; }
  .tile .photo {
    position: absolute; inset: 0;
    background-size: cover; background-position: center; background-repeat: no-repeat;
    opacity: 0; transition: opacity .5s;
  }
  .tile.on .photo { opacity: 1; }
  .tile.on svg { opacity: 0; }
</style>
</head>
<body>
<div id="spacer"></div>

<div class="page" id="page">
  <div class="row label" id="lblPort"><span class="t">Портфолио</span></div>
  <div class="row label" id="lblPost"><span class="t">Постеры</span></div>
  <div id="tiles"></div>

</div>
<div id="head"><div class="row" id="nameRow"><span class="slot"></span><span class="t" id="title">Obsessive Glow</span></div></div>
<div id="fx">
  <div id="stage"></div>
  <div id="hit"></div>
</div>
<div id="hint"><span class="t small">Листай ниже</span><svg width="50" height="28" viewBox="0 0 50 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M44.6659 0.911197C45.8863 -0.303709 47.8645 -0.303756 49.0849 0.911197C50.305 2.12617 50.3051 4.09567 49.0849 5.31054L27.2096 27.0885C26.6236 27.6719 25.8288 27.9999 25.0001 28C24.1714 28 23.3766 27.6718 22.7906 27.0885L0.915303 5.31054C-0.305101 4.09557 -0.305101 2.12617 0.915303 0.911197C2.13571 -0.303708 4.11393 -0.303756 5.33431 0.911197L25.0001 20.4895L44.6659 0.911197Z" fill="#000"/></svg></div>
<div id="err">Не удалось загрузить 3D-библиотеку.</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  // Telegram Mini App: на весь экран, без закрытия свайпом вниз
  (function () {
    var tg = window.Telegram && window.Telegram.WebApp;
    if (!tg) return;
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { tg.disableVerticalSwipes(); } catch (e) {}
    try { tg.setHeaderColor('#ffffff'); } catch (e) {}
    try { tg.setBackgroundColor('#ffffff'); } catch (e) {}
    try { tg.setBottomBarColor('#ffffff'); } catch (e) {}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/SVGLoader.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var page = $('#page'), stage = $('#stage'), hit = $('#hit'), spacer = $('#spacer');
  var titleEl = $('#title'), lblPort = $('#lblPort'), lblPost = $('#lblPost');
  var tilesBox = $('#tiles'), head = $('#head'), hintEl = $('#hint');

  /* ---------- Фото-плитки (положение из макета, в единицах макета 1080) ---------- */
  // [номер, left, top, width, height]  — файлы лежат в папке photos/ : 1.jpg … 9.jpg
  var FRAMES = [
    [1,  55,  450, 630, 280],
    [2, 735,  450, 290, 430],
    [3,  55,  930, 290, 395],
    [4, 395,  930, 630, 840],
    [5,  55, 1375, 290, 395],
    [6,  55, 1820, 970, 431],
    [7,  55, 2301, 290, 387],
    [8, 395, 2301, 290, 387],
    [9, 735, 2301, 290, 387]
  ];
  var X = '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="0" x2="100" y2="100"/><line x1="0" y1="100" x2="100" y2="0"/></svg>';

  function loadImg(n, cb) {
    var exts = ['jpg', 'png', 'webp', 'jpeg'], i = 0;
    (function next() {
      if (i >= exts.length) return;
      var url = 'photos/' + n + '.' + exts[i++];
      var im = new Image();
      im.onload = function () { if (im.decode) im.decode().then(function () { cb(url); }, function () { cb(url); }); else cb(url); };
      im.onerror = next;
      im.src = url;
    })();
  }

  var tiles = FRAMES.map(function (f) {
    var el = document.createElement('div');
    el.className = 'tile';
    el.style.left = 'calc(var(--u) * ' + f[1] + ')';
    el.style.top = 'calc(var(--u) * ' + f[2] + ')';
    el.style.width = 'calc(var(--u) * ' + f[3] + ')';
    el.style.height = 'calc(var(--u) * ' + f[4] + ')';
    el.innerHTML = X + '<div class="photo"></div>';
    tilesBox.appendChild(el);
    var t = { y: f[2], top: 0, el: el, photo: el.lastChild, url: null,
              a: 0.78 + Math.random() * 0.22, rev: false, wantOn: false, timer: 0 };
    loadImg(f[0], function (url) {
      t.url = url;
      t.photo.style.backgroundImage = 'url("' + url + '")';
      if (t.wantOn) t.el.classList.add('on');
    });
    return t;
  });

  function reveal(t) {
    t.rev = true;
    t.el.classList.add('ph');                       // сначала пустой квадрат с крестом
    t.visAt = 0;
    // сколько квадрат «висит» без фото с момента, как попал в экран: верхние чуть дольше, нижние — короче
    t.delay = t.top < vh * 0.9 ? 700 + Math.random() * 800 : 300 + Math.random() * 500;
  }
  function resetTile(t) {
    t.rev = false; t.wantOn = false; t.visAt = 0;
    t.el.classList.remove('on');
    t.el.classList.remove('ph');
  }

  /* ---------- 3D-логотип ---------- */
  if (!window.THREE || !THREE.SVGLoader) {
    $('#err').style.display = 'flex';
    return;
  }
  var SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 71 82"><path fill-rule="evenodd" clip-rule="evenodd" fill="black" d="M33.4863 0C45.3605 0 54.9863 9.62589 54.9863 21.5C54.9863 25.6762 53.7939 29.573 51.7334 32.8721C57.4373 33.0453 62.3559 35.2141 65.8213 39.374C69.3556 43.6167 71 49.472 71 56.2021C70.9997 58.4111 69.209 60.2021 67 60.2021C64.791 60.2021 63.0003 58.4111 63 56.2021C63 50.6742 61.6438 46.8578 59.6748 44.4941C57.7872 42.2283 54.9783 40.8604 50.9863 40.8604C48.3865 40.8605 46.0105 41.6785 43.9805 43.1025C40.1048 45.8214 37.4863 50.7783 37.4863 56.2021C37.4864 58.9493 38.1603 62.2608 39.4043 65.2646C40.6716 68.3246 42.3371 70.6049 43.9805 71.7578C46.0104 73.1818 48.3865 73.9999 50.9863 74C59.2845 74 63.7339 69.0659 64.1719 68.6279C65.7339 67.0662 68.2661 67.0662 69.8281 68.6279C71.3902 70.19 71.3902 72.7231 69.8281 74.2852L69.3643 74.7529C69.0915 75.0199 68.7302 75.3586 68.2822 75.7432C67.3873 76.5113 66.146 77.4606 64.5625 78.3857C61.3836 80.243 56.8264 82 50.9863 82C46.6375 81.9999 42.6733 80.6129 39.3857 78.3066C36.0255 75.9493 33.5926 72.14 32.0127 68.3252C31.6749 67.5094 31.3689 66.6719 31.0938 65.8223C28.4349 75.0034 18.6548 82 4 82C1.79086 82 4.12323e-06 80.2091 0 78C0 75.7909 1.79086 74 4 74C18.4556 74 23.8261 66.4036 23.8262 60.6387C23.8259 54.8733 18.4543 47.2764 4 47.2764C1.90252 47.2764 0.161644 45.6555 0.0107422 43.5635C-0.139955 41.4716 1.35021 39.6184 3.42578 39.3174L18.6953 37.1025C14.6885 33.3028 12.1441 27.9764 11.9941 22.0547L11.9863 21.5C11.9863 9.62603 21.6124 0.000253575 33.4863 0ZM23.0117 44.5605C26.0233 46.6563 28.3191 49.272 29.8125 52.2119C30.3463 48.9331 31.5252 45.8163 33.2422 43.0771L23.0117 44.5605ZM33.4863 8C26.0307 8.00025 19.9863 14.0443 19.9863 21.5C19.9863 28.9558 26.0315 35 33.4873 35C40.9429 34.9997 46.9863 28.9557 46.9863 21.5C46.9863 14.0442 40.9422 8 33.4863 8Z"/></svg>';

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0xffffff, 0);
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a8a, 0.9));
  var key = new THREE.DirectionalLight(0xffffff, 1.6);
  key.position.set(3, 4, 6);
  scene.add(key);
  var fill = new THREE.DirectionalLight(0xffffff, 0.9);
  fill.position.set(-5, -2, -4);
  scene.add(fill);

  var data = new THREE.SVGLoader().parse(SVG);
  var material = new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.38, metalness: 0.15 });
  var inner = new THREE.Group();
  data.paths.forEach(function (path) {
    THREE.SVGLoader.createShapes(path).forEach(function (shape) {
      inner.add(new THREE.Mesh(new THREE.ExtrudeGeometry(shape, {
        depth: 12, curveSegments: 28, bevelEnabled: true,
        bevelThickness: 1.6, bevelSize: 1.2, bevelOffset: 0, bevelSegments: 5
      }), material));
    });
  });
  var box = new THREE.Box3().setFromObject(inner);
  var c = box.getCenter(new THREE.Vector3());
  inner.children.forEach(function (m) { m.position.sub(c); });
  inner.scale.setScalar(2.5 / (box.max.y - box.min.y));
  inner.rotation.x = Math.PI;

  var TILT = 0, START = -0.55;
  var spinner = new THREE.Group(); spinner.add(inner);
  var tilt = new THREE.Group(); tilt.add(spinner);
  scene.add(tilt);

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var AUTO_SPEED = reduce ? 0.18 : 0.5;
  var auto = 0, offX = 0, offY = 0, dragging = false, lastX = 0, lastY = 0;

  hit.addEventListener('pointerdown', function (e) {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    hit.classList.add('dragging');
    try { hit.setPointerCapture(e.pointerId); } catch (err) {}
  });
  hit.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    offY += (e.clientX - lastX) * 0.01;
    offX += (e.clientY - lastY) * 0.01;
    lastX = e.clientX; lastY = e.clientY;
  });
  function release() {
    if (!dragging) return;
    dragging = false;
    hit.classList.remove('dragging');
    var TAU = Math.PI * 2;
    offY = ((offY + Math.PI) % TAU + TAU) % TAU - Math.PI;
    offX = ((offX + Math.PI) % TAU + TAU) % TAU - Math.PI;
  }
  hit.addEventListener('pointerup', release);
  hit.addEventListener('pointercancel', release);
  hit.addEventListener('lostpointercapture', release);

  /* ---------- Размеры и анимация по прокрутке ---------- */
  var pageW = 480, u = 0.444, startY = 1170 * 0.444, endYc = 100 * 0.444, vh = 700, T = 600, titleW = 0, logoFrac = 0.39, sc1 = 0.1;

  function layout() {
    pageW = Math.min(innerWidth, 480);
    u = pageW / 1080;
    vh = innerHeight;
    T = Math.round(Math.max(vh * 0.9, 480));          // сколько прокрутки занимает переезд логотипа
    spacer.style.height = (T + 2888 * u) + 'px';
    titleW = titleEl.offsetWidth;
    var barH = hintEl.offsetHeight, headH = head.offsetHeight;
    endYc = (headH - 200 * u) + 100 * u;               // центр названия (с учётом safe-area сверху)
    startY = (headH + (vh - barH)) / 2;                // лого по центру между подложками
    sc1 = (70 * u) / (logoFrac * 1740 * u);            // во сколько раз лого уменьшается до 70 в шапке
    tiles.forEach(function (t) { t.top = t.y * u; });
  }
  function resize() {
    var w = stage.clientWidth || 1, h = stage.clientHeight || 1;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    var dist = 7.2 / Math.min(1, camera.aspect * 1.25);
    camera.position.set(0, 0, dist);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
    logoFrac = 2.5 / (2 * dist * Math.tan(38 * Math.PI / 360));
    layout();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  addEventListener('resize', resize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  resize();

  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
  function ease(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }

  var pCur = 0, prev = performance.now();
  function frame(now) {
    var dt = Math.min((now - prev) / 1000, 0.05);
    prev = now;

    var sy = window.pageYOffset || document.documentElement.scrollTop || 0;
    var pT = clamp(sy / T, 0, 1);
    pCur += (pT - pCur) * (1 - Math.exp(-dt * 9));
    if (Math.abs(pT - pCur) < 0.0005) pCur = pT;
    var e = ease(pCur);
    var pageScroll = Math.max(0, sy - T);

    head.style.setProperty('--e', e.toFixed(4));
    page.style.transform = 'translate3d(0,' + (-pageScroll) + 'px,0)';

    // 3D-логотип: из центра поля в шапку слева от названия
    var rowW = 86 * u * e + titleW;
    var endX = (pageW - rowW) / 2 + 30.5 * u * e;
    var endY = endYc, startX = pageW / 2;
    stage.style.transform = 'translate3d(' + ((endX - startX) * e) + 'px,' + ((startY - 1170 * u) + (endY - startY) * e) + 'px,0) scale(' + Math.pow(sc1, e) + ')';
    // Зона вращения едет вместе с логотипом (в шапке не меньше 56px, чтобы попасть пальцем)
    var sc = Math.pow(sc1, e);
    var hw = Math.max(560 * u * sc, 56), hh = Math.max(620 * u * sc, 56);
    var hx = startX + (endX - startX) * e, hy = startY + (endY - startY) * e;
    hit.style.left = (hx - hw / 2) + 'px';
    hit.style.top = (hy - hh / 2) + 'px';
    hit.style.width = hw + 'px';
    hit.style.height = hh + 'px';

    // Надписи и фото
    if (pCur < 0.45) {
      lblPort.classList.remove('show');
      lblPost.classList.remove('show');
      for (var k = 0; k < tiles.length; k++) if (tiles[k].rev) resetTile(tiles[k]);
    } else {
      // «Портфолио», «Постеры» и все квадраты с крестами появляются одновременно; фото проявляются хаотично, уже заранее
      if (pCur > 0.55) {
        lblPort.classList.add('show');
        lblPost.classList.add('show');
        for (var i = 0; i < tiles.length; i++) if (!tiles[i].rev) reveal(tiles[i]);
      }
      // Фото проявляется, когда квадрат попал в экран и «повисел» немного; по мере листания вниз — так же для нижних
      for (var j = 0; j < tiles.length; j++) {
        var tj = tiles[j];
        if (!tj.rev || tj.wantOn) continue;
        if (tj.top - pageScroll < vh * 0.88) {
          if (!tj.visAt) tj.visAt = now;
          if (now - tj.visAt > tj.delay) {
            tj.wantOn = true;
            if (tj.url) tj.el.classList.add('on');
          }
        }
      }
    }

    if (!dragging) {
      var kk = 1 - Math.exp(-dt * 3.2);
      offX -= offX * kk;
      offY -= offY * kk;
    }
    auto += AUTO_SPEED * dt;
    tilt.rotation.x = TILT + offX;
    spinner.rotation.y = START + auto + offY;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
