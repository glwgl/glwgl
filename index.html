<style>
  :root { color-scheme: light; --u: calc(min(100vw, 480px) / 1080); }
  html, body { margin: 0; background: #fff; }
  body {
    overflow-x: hidden;
    color: #000;
    font-family: 'Liter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Макет шириной 1080: --u переводит его размеры в реальные пиксели экрана (на широких экранах ограничено 480px). */
  .page {
    --e: 0;
    position: fixed;
    top: 0;
    left: 50%;
    width: min(100vw, 480px);
    margin-left: calc(min(100vw, 480px) / -2);
    height: calc(var(--u) * 6618);
    will-change: transform;
  }

  .row {
    position: absolute;
    left: 0;
    width: 100%;
    height: calc(var(--u) * 100);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .t {
    display: block;
    white-space: nowrap;
    font-weight: 400;
    font-size: calc(var(--u) * 100);
    letter-spacing: -0.05em;
    line-height: normal;
    text-box: trim-both cap alphabetic;
  }
  .t.small { font-size: calc(var(--u) * 70); letter-spacing: -0.05em; line-height: 1; }

  /* Шапка: белая подложка 200 (50 отступ, 100 название, 50 отступ), закреплена сверху */
  #head {
    --e: 0;
    position: fixed;
    top: 0;
    left: 50%;
    width: min(100vw, 480px);
    margin-left: calc(min(100vw, 480px) / -2);
    box-sizing: border-box;
    height: calc(var(--u) * 200 + env(safe-area-inset-top, 0px));
    background: #fff;
    z-index: 20;
  }
  #nameRow { top: calc(var(--u) * 50 + env(safe-area-inset-top, 0px)); }
  /* Слой над шапкой: 3D-лого и зона вращения (лого заезжает в шапку поверх подложки) */
  #fx {
    position: fixed;
    top: 0;
    left: 50%;
    width: min(100vw, 480px);
    margin-left: calc(min(100vw, 480px) / -2);
    height: 100%;
    pointer-events: none;
    z-index: 30;
  }
  /* Место под логотип слева от названия: растёт от 0 до 61×70 по мере прокрутки. */
  .slot {
    flex: none;
    width: calc(var(--u) * 61 * var(--e));
    margin-right: calc(var(--u) * 25 * var(--e));
    height: 1px;
  }

  /* «Листай ниже»: белая подложка 200 (50 отступ, 100 текст, 50 отступ), закреплена снизу, контент уезжает под неё */
  #hint {
    position: fixed;
    left: 50%;
    width: min(100vw, 480px);
    margin-left: calc(min(100vw, 480px) / -2);
    bottom: 0;
    box-sizing: border-box;
    height: calc(var(--u) * 200 + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: calc(var(--u) * 25);
    background: #fff;
    color: #000;
    pointer-events: none;
    z-index: 20;
  }
  #hint svg { flex: none; width: calc(var(--u) * 50); height: calc(var(--u) * 28); }

  /* Появление надписей: обычное мягкое всплытие */
  .label {
    opacity: 0;
    transform: translateY(calc(var(--u) * 40));
    transition: opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1);
  }
  .label.show { opacity: 1; transform: none; }
  #lblPort { top: calc(var(--u) * 200); }
  #lblPost { top: calc(var(--u) * 680); left: calc(var(--u) * 55); width: calc(var(--u) * 630); }
  #lblSites { top: calc(var(--u) * 2638); left: calc(var(--u) * 565); width: calc(var(--u) * 460); }
  #lblAva { top: calc(var(--u) * 4531); left: calc(var(--u) * 55); width: calc(var(--u) * 630); }
  #lblPosts { top: calc(var(--u) * 4871); left: calc(var(--u) * 735); width: calc(var(--u) * 290); }
  #lblEmoji { top: calc(var(--u) * 5918); left: calc(var(--u) * 55); width: calc(var(--u) * 630); }

  /* Бегущая строка эмодзи: прозрачное поле на всю ширину экрана, высота 350, эмодзи плавно уезжают влево, справа появляются новые */
  #emoji {
    position: absolute;
    left: 0;
    top: calc(var(--u) * 6068);
    width: 100%;                   /* ровно по ширине экрана/макета: за краем эмодзи обрезаются и пропадают */
    height: calc(var(--u) * 350);
    overflow: hidden;
    clip-path: inset(0);
    opacity: 0;
    transition: opacity .4s ease-out;
  }
  #emoji.ph { opacity: 1; }
  .em {
    position: absolute;
    left: 0;
    top: calc(var(--u) * 60);
    height: calc(var(--u) * 230);
    display: none;                 /* показывается из JS, только пока эмодзи в кадре */
    will-change: transform;
    pointer-events: none;
    contain: layout style;
    /* мягкая тень: белые эмодзи не сливаются с белым фоном */
    filter: drop-shadow(0 calc(var(--u) * 3) calc(var(--u) * 7) rgba(0, 0, 0, .34));
  }
  .em svg { display: block; width: 100% !important; height: 100% !important; }

  /* 3D-логотип: поле 1080×1740 на отметке 300, потом уезжает в шапку */
  #stage {
    position: absolute;
    left: 0;
    top: calc(var(--u) * 300);
    width: 100%;
    height: calc(var(--u) * 1740);
    pointer-events: none;
    transform-origin: 50% 50%;
    will-change: transform;
  }
  #stage canvas { display: block; width: 100%; height: 100%; pointer-events: none; }
  /* Зона вращения меньше всего поля: всё вокруг логотипа остаётся для обычной прокрутки */
  #hit {
    position: absolute;
    left: 0; top: 0; width: 0; height: 0;
    pointer-events: auto;
    touch-action: none;
    cursor: grab;
  }
  #hit.dragging { cursor: grabbing; }
  #err {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    font: 14px/1.4 system-ui, sans-serif;
  }

  /* Фото: сначала «непрогруженный» квадрат с крестом, потом фото */
  .tile {
    position: absolute;
    box-sizing: border-box;
    border: max(calc(var(--u) * 1), 1px) solid #000;
    background: #fff;
    opacity: 0;
    transition: opacity .2s linear;
  }
  .tile.ph { opacity: 1; }
  .tile svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: opacity .5s; }
  .tile svg line { stroke: #222; stroke-width: 1; vector-effect: non-scaling-stroke; }
  .tile .photo {
    position: absolute; inset: 0;
    background-size: cover; background-position: center; background-repeat: no-repeat;
    opacity: 0; transition: opacity .5s;
  }
  .tile.on .photo { opacity: 1; }
  .tile.on svg { opacity: 0; }
</style>
</head>

<script>

  /* ---------- Фото-плитки (положение из макета, в единицах макета 1080) ---------- */

  var FRAMES = [

    if (f[0] <= 3) go(); else if (f[0] <= 9) setTimeout(go, 350); else setTimeout(go, 900 + (f[0] - 10) * 200);   // верхние фото грузятся первыми и с высоким приоритетом, остальные чуть позже

  });

      t.delay = 180 + Math.random() * 320;
      return;
    }
    var fr = Math.min(1, t.y / 2300);                       // 0 — самый верх, 1 — самый низ

    // сколько квадрат «висит» без фото с момента, как попал в экран: верхние чуть дольше, нижние — короче
    t.delay = first ? 40 + Math.random() * 80 : (t.top < vh * 0.9 ? 300 + fr * 220 + Math.random() * 280 : 140 + Math.random() * 260);
  }
  function resetTile(t) {
    t.rev = false; t.ph = false; t.wantOn = false; t.visAt = 0;
    t.el.classList.remove('on');
    t.el.classList.remove('ph');
  }

  /* ---------- 3D-логотип ---------- */
  if (!window.THREE || !THREE.SVGLoader) {
    $('#err').style.display = 'flex';
    return;
  }
  var SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 71 82"><path fill-rule="evenodd" clip-rule="evenodd" fill="black" d="M33.4863 0C45.3605 0 54.9863 9.62589 54.9863 21.5C54.9863 25.6762 53.7939 29.573 51.7334 32.8721C57.4373 33.0453 62.3559 35.2141 65.8213 39.374C69.3556 43.6167 71 49.472 71 56.2021C70.9997 58.4111 69.209 60.2021 67 60.2021C64.791 60.2021 63.0003 58.4111 63 56.2021C63 50.6742 61.6438 46.8578 59.6748 44.4941C57.7872 42.2283 54.9783 40.8604 50.9863 40.8604C48.3865 40.8605 46.0105 41.6785 43.9805 43.1025C40.1048 45.8214 37.4863 50.7783 37.4863 56.2021C37.4864 58.9493 38.1603 62.2608 39.4043 65.2646C40.6716 68.3246 42.3371 70.6049 43.9805 71.7578C46.0104 73.1818 48.3865 73.9999 50.9863 74C59.2845 74 63.7339 69.0659 64.1719 68.6279C65.7339 67.0662 68.2661 67.0662 69.8281 68.6279C71.3902 70.19 71.3902 72.7231 69.8281 74.2852L69.3643 74.7529C69.0915 75.0199 68.7302 75.3586 68.2822 75.7432C67.3873 76.5113 66.146 77.4606 64.5625 78.3857C61.3836 80.243 56.8264 82 50.9863 82C46.6375 81.9999 42.6733 80.6129 39.3857 78.3066C36.0255 75.9493 33.5926 72.14 32.0127 68.3252C31.6749 67.5094 31.3689 66.6719 31.0938 65.8223C28.4349 75.0034 18.6548 82 4 82C1.79086 82 4.12323e-06 80.2091 0 78C0 75.7909 1.79086 74 4 74C18.4556 74 23.8261 66.4036 23.8262 60.6387C23.8259 54.8733 18.4543 47.2764 4 47.2764C1.90252 47.2764 0.161644 45.6555 0.0107422 43.5635C-0.139955 41.4716 1.35021 39.6184 3.42578 39.3174L18.6953 37.1025C14.6885 33.3028 12.1441 27.9764 11.9941 22.0547L11.9863 21.5C11.9863 9.62603 21.6124 0.000253575 33.4863 0ZM23.0117 44.5605C26.0233 46.6563 28.3191 49.272 29.8125 52.2119C30.3463 48.9331 31.5252 45.8163 33.2422 43.0771L23.0117 44.5605ZM33.4863 8C26.0307 8.00025 19.9863 14.0443 19.9863 21.5C19.9863 28.9558 26.0315 35 33.4873 35C40.9429 34.9997 46.9863 28.9557 46.9863 21.5C46.9863 14.0442 40.9422 8 33.4863 8Z"/></svg>';

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  var DPR = Math.min(window.devicePixelRatio || 1, 2), resLevel = 1;
  renderer.setPixelRatio(DPR);
  // Когда лого уменьшается до шапки, холст не нужно рендерить в полном разрешении
  var RES_LEVELS = [0.12, 0.18, 0.25, 0.35, 0.5, 0.7, 1];
  function setRes(sc) {
    var need = Math.min(1, sc * 1.25), lv = 1;
    for (var i = 0; i < RES_LEVELS.length; i++) if (RES_LEVELS[i] >= need) { lv = RES_LEVELS[i]; break; }

  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a8a, 0.9));
  var key = new THREE.DirectionalLight(0xffffff, 1.6);
  key.position.set(3, 4, 6);

  var fill = new THREE.DirectionalLight(0xffffff, 0.9);

  var material = new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.38, metalness: 0.15 });

    T = Math.round(Math.max(vh * 0.75, 420));          // сколько прокрутки занимает переезд логотипа
    spacer.style.height = (T + 6618 * u) + 'px';

    var barH = hintEl.offsetHeight, headH = head.offsetHeight;

    tiles.forEach(function (t) { t.top = t.y * u; });

    if (emInit) emRelayout();
  }
  function resize() {
    var w = stage.clientWidth || 1, h = stage.clientHeight || 1;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    var dist = 7.2 / Math.min(1, camera.aspect * 1.25);
    camera.position.set(0, 0, dist);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
    logoFrac = 2.5 / (2 * dist * Math.tan(38 * Math.PI / 360));
    layout();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  addEventListener('resize', resize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  resize();

  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
  function ease(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }

  var LAZY_LABELS = [
    { el: $('#lblSites'), y: 2638 },
    { el: $('#lblAva'), y: 4531 },
    { el: $('#lblPosts'), y: 4871 },
    { el: $('#lblEmoji'), y: 5918 }
  ];
  var EMOJI_Y = 6068, EMOJI_H = 350;
  var emojiBox = $('#emoji');

  /* ---------- Бегущая строка эмодзи (Lottie) ----------
     Оптимизация: эмодзи создаются один раз (по кругу, «лентой»), а не пересоздаются на ходу; тяжёлые
     анимации не грузятся вместе со страницей; невидимые эмодзи скрыты и не обновляются; анимация
     рисуется не чаще 30 к/с (и сама снижает частоту на слабом устройстве). Все размеры — в единицах макета 1080. */
  var EM_COUNT = 9, EM_WIDE = { 3: 2, 8: 2 };   // 3 и 8 — широкие (1024×512)
  var EM_GAP = 40, EM_SPEED = 90, EM_H = 230;
  var EM_FPS = [30, 20, 12], emTier = 0, emAcc = 0, emN = 0;
  var emSlots = [], emTotal = 0, emW = 480, emVisible = false, emT0 = performance.now(), emReady = false;

  function emAddSlot(n) {
    var wU = EM_H * (EM_WIDE[n] || 1);
    var el = document.createElement('div');
    el.className = 'em';
    emojiBox.appendChild(el);
    var edge = 0;
    for (var i = 0; i < emSlots.length; i++) edge = Math.max(edge, emSlots[i].x + emSlots[i].wU + EM_GAP);
    var sl = { n: n, el: el, wU: wU, x: edge || EM_GAP, shown: false, built: false, anim: null, frames: 180, f: -1, t: 0, tx: NaN };
    emSlots.push(sl);
    emTotal += wU + EM_GAP;
    return sl;
  }
  function emRelayout() {
    emW = emojiBox.clientWidth || pageW;
    // лента должна быть длиннее экрана + самого широкого эмодзи, иначе справа будет дырка (на десктопе — две копии)
    while (emTotal < emW / u + 560) for (var n = 1; n <= EM_COUNT; n++) emAddSlot(n);
    for (var i = 0; i < emSlots.length; i++) emSlots[i].el.style.width = (emSlots[i].wU * u) + 'px';
  }
  function emClone(d) { return typeof structuredClone === 'function' ? structuredClone(d) : JSON.parse(JSON.stringify(d)); }
  function emBuild(sl) {
    sl.built = true;
    var d = (window.EMOJI_DATA || {})[sl.n];
    if (!d || !window.lottie) return;
    sl.frames = Math.max(1, (d.op || 180) - (d.ip || 0));
    sl.anim = lottie.loadAnimation({
      container: sl.el, renderer: 'svg', loop: false, autoplay: false,
      animationData: emClone(d),
      rendererSettings: { preserveAspectRatio: 'xMidYMid meet' }
    });
  }
  // Создаём по одному эмодзи за раз, чтобы не было просадки; сначала те, что уже в кадре
  function emBuildNext() {
    var pick = null;
    for (var i = 0; i < emSlots.length; i++) {
      var sl = emSlots[i];
      if (sl.built) continue;
      if (!pick) pick = sl;
      if (sl.shown) { pick = sl; break; }
    }
    if (!pick) return;
    emBuild(pick);
    setTimeout(emBuildNext, 90);
  }
  function emLoadLibs() {
    var left = 2;
    function done() { if (--left === 0) emBuildNext(); }
    ['https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie_light.min.js', 'emoji-data.js'].forEach(function (src) {
      var sc = document.createElement('script');
      sc.async = true;
      try { sc.fetchPriority = 'low'; } catch (e) {}
      sc.onload = done;
      sc.src = src;
      document.head.appendChild(sc);
    });
  }
  function emUpdate(dt, now, visible) {
    if (!visible) { emVisible = false; emAcc = 0; emN = 0; return; }
    emVisible = true;
    // если кадры идут медленно — снижаем частоту анимации эмодзи
    emAcc += dt; emN++;
    if (emN >= 90) { if (emAcc / emN > 0.026 && emTier < EM_FPS.length - 1) emTier++; emAcc = 0; emN = 0; }

    var move = EM_SPEED * dt, step = 1000 / EM_FPS[emTier], uW = emW / u;
    for (var i = 0; i < emSlots.length; i++) {
      var sl = emSlots[i];
      sl.x -= move;
      if (sl.x + sl.wU < -20) sl.x += emTotal;               // ушло влево — переезжает в конец ленты
      var on = sl.x + sl.wU > 0 && sl.x < uW;
      if (on) {
        var tx = (sl.x * u).toFixed(1);
        if (tx !== sl.tx) { sl.tx = tx; sl.el.style.transform = 'translate3d(' + tx + 'px,0,0)'; }
        if (!sl.shown) { sl.shown = true; sl.el.style.display = 'block'; }
        if (sl.anim && now - sl.t >= step) {
          sl.t = now;
          var f = Math.floor(((now - emT0) * 0.06) % sl.frames);   // 60 кадров/с исходной анимации
          if (f !== sl.f) { sl.f = f; sl.anim.goToAndStop(f, true); }
        }
      } else if (sl.shown) {
        sl.shown = false; sl.el.style.display = 'none';
      }
    }
  }
  emInit = true;
  emRelayout();
  function emStart() { setTimeout(emLoadLibs, 700); }
  if (document.readyState === 'complete') emStart(); else addEventListener('load', emStart);

  var pCur = 0, prev = performance.now(), portAt = 0, lastKey = '', lastRender = 0;
  function frame(now) {
    var dt = Math.min((now - prev) / 1000, 0.05);
    prev = now;

    var sy = window.pageYOffset || document.documentElement.scrollTop || 0;
    var pT = clamp(sy / T, 0, 1);
    pCur += (pT - pCur) * (1 - Math.exp(-dt * 11));
    if (Math.abs(pT - pCur) < 0.0005) pCur = pT;
    var e = ease(pCur);
    var pageScroll = Math.max(0, sy - T);

    // Стили пишем только если прокрутка/размеры поменялись (в покое страница ничего не перерисовывает)
    var key = e.toFixed(4) + '|' + pageScroll;
    if (dirty || key !== lastKey) {
      dirty = false; lastKey = key;
      head.style.setProperty('--e', e.toFixed(4));
      page.style.transform = 'translate3d(0,' + (-pageScroll) + 'px,0)';

      // 3D-логотип: из центра поля в шапку слева от названия
      var rowW = 86 * u * e + titleW;
      var endX = (pageW - rowW) / 2 + 30.5 * u * e;
      var endY = endYc, startX = pageW / 2;
      var sc = Math.pow(sc1, e);
      stage.style.transform = 'translate3d(' + ((endX - startX) * e) + 'px,' + ((startY - 1170 * u) + (endY - startY) * e) + 'px,0) scale(' + sc + ')';
      // Зона вращения едет вместе с логотипом (в шапке не меньше 56px, чтобы попасть пальцем)
      var hw = Math.max(560 * u * sc, 56), hh = Math.max(620 * u * sc, 56);
      var hx = startX + (endX - startX) * e, hy = startY + (endY - startY) * e;
      hit.style.left = (hx - hw / 2) + 'px';
      hit.style.top = (hy - hh / 2) + 'px';
      hit.style.width = hw + 'px';
      hit.style.height = hh + 'px';
      setRes(sc);
    }

    // Надписи и фото
    if (pCur < 0.45) {
      lblPort.classList.remove('show');
      lblPost.classList.remove('show');
      portAt = 0;
      for (var q = 0; q < LAZY_LABELS.length; q++) LAZY_LABELS[q].el.classList.remove('show');
      emojiBox.classList.remove('ph');
      for (var k = 0; k < tiles.length; k++) if (tiles[k].rev) resetTile(tiles[k]);
    } else {
      // «Портфолио» сразу, «Постеры» чуть позже; квадраты с крестами — хаотично, не одновременно
      if (pCur > 0.55) {
        if (!portAt) { portAt = now; lblPort.classList.add('show'); }
        if (now - portAt > 350) lblPost.classList.add('show');
        for (var i = 0; i < tiles.length; i++) {
          var ti = tiles[i];
          if (!ti.rev && (!ti.lazy || ti.top - pageScroll < vh * 1.1)) reveal(ti);
          if (!ti.ph && now >= ti.showAt) { ti.ph = true; ti.el.classList.add('ph'); }
        }
      }
      // Подписи нижних блоков и бегущая строка появляются, когда до них долистали
      if (pCur > 0.55) {
        for (var q2 = 0; q2 < LAZY_LABELS.length; q2++) {
          var ll = LAZY_LABELS[q2];
          if (ll.y * u - pageScroll < vh * 0.9) ll.el.classList.add('show');
        }
        if (EMOJI_Y * u - pageScroll < vh * 1.05) emojiBox.classList.add('ph');
      }
      // Фото проявляется, когда квадрат попал в экран и «повисел» немного; по мере листания вниз — так же для нижних
      for (var j = 0; j < tiles.length; j++) {
        var tj = tiles[j];
        if (!tj.rev || !tj.ph || tj.wantOn) continue;
        if (tj.top - pageScroll < vh * 0.88) {
          if (!tj.visAt) tj.visAt = now;
          if (now - tj.visAt > tj.delay) {
            tj.wantOn = true;
            if (tj.url) tj.el.classList.add('on');
          }
        }
      }
    }

    // бегущая строка: двигаем, только когда она в экране
    var emTop = EMOJI_Y * u - pageScroll;
    emUpdate(dt, now, emTop < vh && emTop + EMOJI_H * u > 0);

    if (!dragging) {
      var kk = 1 - Math.exp(-dt * 3.2);
      offX -= offX * kk;
      offY -= offY * kk;
    }
    auto += AUTO_SPEED * dt;
    tilt.rotation.x = TILT + offX;
    spinner.rotation.y = START + auto + offY;
    // когда лого уже в шапке — достаточно ~30 к/с
    if (e < 0.999 || now - lastRender > 30) { lastRender = now; renderer.render(scene, camera); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
